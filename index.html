        const WEEK_KEYS = ['w1', 'w2', 'w3', 'w4', 'w5', 'w6', 'w7', 'w8'];

        const TASKS_MAX = 10;

        const DEFAULT_PROGRESSION = { l2: 64, l3: 98 };
        const DEFAULT_CONTROL_RULES = { yearWorkMax: 40, finalMax: 60, minFinalPercent: 30, graceMarks: 1, absenceLimitPercent: 25 };

        const getProgressionRules = (reg) => ({
            l1: reg?.semesterRules?.minProgressionHours ?? 28,
            l2: reg?.progressionRules?.l2 ?? DEFAULT_PROGRESSION.l2,
            l3: reg?.progressionRules?.l3 ?? DEFAULT_PROGRESSION.l3,
        });
        const getControlRules = (reg) => ({ ...DEFAULT_CONTROL_RULES, ...(reg?.controlRules || {}) });

        // Returns whether a student meets the promotion conditions of his current level
        const evaluatePromotion = (student, rules) => {
            const required = student.level === 1 ? rules.l1 : student.level === 2 ? rules.l2 : student.level === 3 ? rules.l3 : null;
            if (required === null) return { eligible: false, required: null, reasons: ['الفرقة الأخيرة - التخرج وليس الترقية'], shortfall: 0, final: true };
            const reasons = [];
            const shortfall = Math.max(0, required - (student.passedCredits || 0));
            if (shortfall > 0) reasons.push(`ناقص ${shortfall} ساعة معتمدة (المجتاز ${student.passedCredits} من ${required} المطلوبة)`);
            if (student.academicStatus === 'Suspended') reasons.push('حالة القيد: موقوف / مجمد');
            return { eligible: reasons.length === 0, required, reasons, shortfall, final: false };
        };

        const attendanceMarksFromLogs = (logs) => {
            const vals = WEEK_KEYS.map(w => (logs && logs[w]) || 'P');
            const score = vals.reduce((a, v) => a + (v === 'P' ? 1 : v === 'L' ? 0.5 : 0), 0);
            return Math.round((score / WEEK_KEYS.length) * ATTENDANCE_MAX);
        };
        const summarizeLogs = (logs) => {
            const vals = WEEK_KEYS.map(w => (logs && logs[w]) || 'P');
            const present = vals.filter(v => v === 'P').length;
            const late = vals.filter(v => v === 'L').length;
            const absent = vals.filter(v => v === 'A').length;
            const percent = Math.round(((present + late * 0.5) / vals.length) * 100);
            const absencePercent = Math.round((absent / vals.length) * 100);
            return { present, late, absent, percent, absencePercent, total: vals.length };
        };
        const getYearWork = (g) => (g.attendanceMarks || 0) + (g.taskMarks || 0) + (g.midtermMarks || 0);

        // Converts marks to total/letter/points using the regulation grade scale + final-exam minimum rule
        const computeGradeResult = (g, regulation) => {
            const rules = getControlRules(regulation);
            const scale = [...(regulation?.gradeScales || [])].sort((a, b) => b.minPercent - a.minPercent);
            const yearWork = getYearWork(g);
            const finalMark = g.isAbsent ? 0 : (g.finalExamMark || 0);
            const totalMark = yearWork + finalMark + (g.graceMarksApplied || 0);
            const minFinal = (rules.finalMax * rules.minFinalPercent) / 100;
            const passedFinal = !g.isAbsent && finalMark >= minFinal;
            let letterGrade = 'F', points = 0;
            if (passedFinal) {
                const hit = scale.find(sc => totalMark >= sc.minPercent);
                if (hit) { letterGrade = hit.grade; points = hit.points; }
            }
            return { totalMark, letterGrade, points, passedFinal, minFinal };
        };

                s = (s * 9301 + 49297) % 233280;

            const stats = useMemo(() => {
                const totalWarned = students.filter(s => s.academicStatus === 'Academic Warning').length;

                const honors = students.filter(s => s.cgpa >= 3.50).length;

                return { totalWarned, article25Risk, honors, activeOverrides };
            }, [students]);

            const filtered = useMemo(() => {
                return students.filter(s => {
                    const matchQuery = !searchQuery || s.nameAr.includes(searchQuery) || s.academicId.includes(searchQuery);
                    const matchStatus = filterStatus === 'ALL' ||
                        (filterStatus === 'Warned' && s.academicStatus === 'Academic Warning') ||
                        (filterStatus === 'Honors' && s.cgpa >= 3.50) ||
                        (filterStatus === 'Overrides' && s.maxCreditOverride !== null) ||
                        (filterStatus === 'NotPromoted' && s.level < 4 && !evaluatePromotion(s, rules).eligible);
                    const matchLevel = levelFilter === 'ALL' || s.level === Number(levelFilter);
                    return matchQuery && matchStatus && matchLevel;

                setStudents(students.map(s => s.id === updatedStudent.id ? updatedStudent : s));

                        </div>

        // =====================================================================
        // PROGRESSION & BRANCHING (all levels + direct link to status tracking)
        // =====================================================================
        function ProgressionAndBranchingView({ students, setStudents, departments, regulations, showToast, onOpenStatusTracking }) {
            const activeReg = useMemo(() => regulations.find(r => r.status === 'Active') || regulations[0], [regulations]);
            const rules = getProgressionRules(activeReg);
            const [reports, setReports] = useState({});
            const [runningLevel, setRunningLevel] = useState(null);
            const [isBranchingModalOpen, setIsBranchingModalOpen] = useState(false);

            const transitions = [
                { from: 1, to: 2, hours: rules.l1, title: 'من الفرقة الأولى إلى الفرقة الثانية' },
                { from: 2, to: 3, hours: rules.l2, title: 'من الفرقة الثانية إلى الفرقة الثالثة' },
                { from: 3, to: 4, hours: rules.l3, title: 'من الفرقة الثالثة إلى الفرقة الرابعة' },
            ];

            const levelStats = transitions.map(t => {
                const inLevel = students.filter(s => s.level === t.from);
                const evals = inLevel.map(s => ({ s, ev: evaluatePromotion(s, rules) }));
                return {
                    ...t,
                    total: inLevel.length,
                    eligible: evals.filter(e => e.ev.eligible).map(e => e.s),
                    blocked: evals.filter(e => !e.ev.eligible)
                };
            });

            const handleRun = (t) => {
                setRunningLevel(t.from);
                setTimeout(() => {
                    const st = levelStats.find(x => x.from === t.from);
                    setReports(prev => ({
                        ...prev,
                        [t.from]: { promotedIds: st.eligible.map(s => s.id), retainedCount: st.blocked.length, applied: false }
                    }));
                    setRunningLevel(null);
                    showToast(`تم فحص شروط الترقية ${t.title} - راجع النتيجة ثم اعتمد التنفيذ.`, 'info');
                }, 800);
            };

            const handleApply = (t) => {
                const rep = reports[t.from];
                if (!rep || rep.applied) return;
                const ids = new Set(rep.promotedIds);
                setStudents(prev => prev.map(s => (ids.has(s.id) && s.level === t.from) ? { ...s, level: s.level + 1 } : s));
                setReports(prev => ({ ...prev, [t.from]: { ...prev[t.from], applied: true } }));
                showToast(`تم اعتماد وترقية ${rep.promotedIds.length} طالب ${t.title}.`);
            };

            const branchingStudents = students.filter(s => s.level <= 2);

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div>
                            <h1 className="text-2xl font-extrabold text-slate-900">الترقية والتشعيب الأكاديمي (Progression & Department Branching)</h1>
                            <p className="text-slate-500 text-sm mt-1">
                                محرك الترقية لجميع الفرق الدراسية وفق لائحة <strong className="text-blue-700">{activeReg?.code}</strong> مع إظهار الشروط وعدد الطلاب غير المنتقلين وتوزيع الرغبات والتنسيق.
                            </p>
                        </div>
                    </div>

                    {/* Progression Engine: one card per transition */}
                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-5">
                        {levelStats.map((t) => {
                            const rep = reports[t.from];
                            return (

            const [roleModal, setRoleModal] = useState(null); // null | 'new' | role object

            const roleByName = (name) => roles.find(r => r.name === name);
            const staffCount = (roleName) => staffList.filter(s => s.accessLevel === roleName).length;

            const filteredStaff = useMemo(() => {
                if (selectedRoleTab === 'ALL') return staffList;
                return staffList.filter(s => s.department.includes(selectedRoleTab));
            }, [staffList, selectedRoleTab]);

            const nextStaffId = `STF-${String(staffList.length + 1).padStart(3, '0')}`;

            const handleSaveStaff = (member) => {
                setStaffList([...staffList, member]);
                setIsStaffModalOpen(false);
                showToast(`تمت إضافة الموظف (${member.name}) بكود ${member.staffId} بنجاح.`);
            };

            const togglePermission = (roleId, key) => {
                setRoles(roles.map(r => r.id !== roleId ? r : {
                    ...r,
                    permissions: r.permissions.includes(key) ? r.permissions.filter(k => k !== key) : [...r.permissions, key]
                }));
                showToast('تم تحديث مصفوفة الصلاحيات (RBAC Permissions) بنجاح');
            };

            const handleSaveRole = (role) => {
                if (roleModal && roleModal !== 'new') {
                    setRoles(roles.map(r => r.id === role.id ? role : r));
                    showToast(`تم تحديث مستوى الصلاحيات (${role.nameAr}).`);
                } else {
                    setRoles([...roles, { ...role, id: `ROLE-${Date.now().toString().slice(-6)}`, system: false }]);
                    showToast(`تم إنشاء مستوى الصلاحيات الجديد (${role.nameAr}) ويمكن إسناده للموظفين الآن.`);
                }
                setRoleModal(null);
            };

            const handleDeleteRole = (role) => {
                if (staffCount(role.name) > 0) {
                    showToast('لا يمكن حذف مستوى مُسند لموظفين حالياً، أعد إسنادهم أولاً.', 'error');
                    return;
                }
                setRoles(roles.filter(r => r.id !== role.id));
                showToast(`تم حذف المستوى (${role.nameAr}).`);
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div>
                            <h1 className="text-2xl font-extrabold text-slate-900">الموظفون وإدارة الصلاحيات (Staff & Roles Management - RBAC)</h1>
                            <p className="text-slate-500 text-sm mt-1">التحكم بنظام الصلاحيات القائم على الأدوار <span className="font-bold text-slate-700">(Role-Based Access Control)</span>، وإضافة الموظفين وبناء مستويات صلاحيات مخصصة.</p>
                        </div>
                        <div className="flex items-center gap-3 flex-wrap">
                            <button onClick={() => setActiveSubView('directory')} className={`px-4 py-2 rounded-xl font-bold text-xs transition ${activeSubView === 'directory' ? 'bg-blue-700 text-white shadow' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                                دليل الموظفين (Staff Directory)
                            </button>
                            <button onClick={() => setActiveSubView('matrix')} className={`px-4 py-2 rounded-xl font-bold text-xs transition ${activeSubView === 'matrix' ? 'bg-blue-700 text-white shadow' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                                مصفوفة الصلاحيات (Permissions Matrix)
                            </button>
                            {activeSubView === 'directory' ? (
                                <button onClick={() => setIsStaffModalOpen(true)} className="px-4 py-2 rounded-xl font-extrabold text-xs bg-emerald-600 hover:bg-emerald-700 text-white shadow flex items-center gap-2">
                                    <i data-lucide="user-plus" className="w-4 h-4"></i><span>إضافة موظف جديد</span>
                                </button>
                            ) : (
                                <button onClick={() => setRoleModal('new')} className="px-4 py-2 rounded-xl font-extrabold text-xs bg-amber-500 hover:bg-amber-600 text-slate-950 shadow flex items-center gap-2">
                                    <i data-lucide="shield-check" className="w-4 h-4"></i><span>إنشاء مستوى صلاحيات مخصص</span>
                                </button>
                            )}
                        </div>
                    </div>

                    {activeSubView === 'directory' && (
                        <div className="space-y-6">
                            <div className="flex items-center gap-3 overflow-x-auto bg-white p-3 rounded-2xl border border-slate-200 text-xs font-bold">
                                {[{ id: 'ALL', label: 'جميع الموظفين' }, ...ADMIN_UNITS.map(u => ({ id: u.split(' (')[1] ? u.split(' (')[1].replace(')', '') : u, label: u }))].map((tab) => (
                                    <button key={tab.id} onClick={() => setSelectedRoleTab(tab.id)}
                                        className={`px-4 py-2 rounded-xl transition whitespace-nowrap ${selectedRoleTab === tab.id ? 'bg-blue-100 text-blue-900 border border-blue-300 font-extrabold' : 'text-slate-600 hover:bg-slate-100'}`}>
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                                <table className="w-full text-right text-xs">
                                    <thead className="bg-slate-100 text-slate-700 font-extrabold border-b border-slate-200">
                                        <tr>
                                            <th className="p-4">كود الموظف (Staff ID)</th>
                                            <th className="p-4">الاسم (Name)</th>
                                            <th className="p-4">المسمى الوظيفي (Assigned Role)</th>
                                            <th className="p-4">الإدارة / القسم</th>
                                            <th className="p-4">مستوى الوصول (Access Level)</th>
                                            <th className="p-4 text-center">الحالة (Status)</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200">
                                        {filteredStaff.map((s) => {
                                            const r = roleByName(s.accessLevel);
                                            const col = ROLE_COLORS[r?.color || 'slate'];
                                            return (
                                                <tr key={s.id} className="hover:bg-slate-50 transition">
                                                    <td className="p-4 font-mono font-bold text-blue-700">{s.staffId}</td>
                                                    <td className="p-4 font-bold text-slate-900">
                                                        {s.name}
                                                        {s.phone && <span className="block text-[10px] text-slate-400 font-mono">{s.phone}</span>}
                                                    </td>
                                                    <td className="p-4 font-semibold text-slate-800">{s.assignedRole}</td>
                                                    <td className="p-4 text-slate-600">{s.department}</td>
                                                    <td className="p-4"><span className={`px-2.5 py-1 rounded-lg text-[11px] font-bold border ${col.badge}`}>{s.accessLevel}</span></td>
                                                    <td className="p-4 text-center">
                                                        <span className={`px-2.5 py-1 rounded-full text-[11px] font-bold ${s.status === 'Active' ? 'bg-emerald-100 text-emerald-800' : s.status === 'On Leave' ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'}`}>
                                                            {s.status === 'Active' ? 'نشط (Active)' : s.status === 'On Leave' ? 'في إجازة' : 'مجمّد'}
                                                        </span>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {activeSubView === 'matrix' && (
                        <div className="space-y-6">
                            <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-md">
                                <h3 className="text-lg font-bold">مصفوفة تحديد الصلاحيات (Permissions Matrix Builder)</h3>
                                <p className="text-slate-400 text-xs mt-1">حدد الصلاحيات المسموحة لكل مستوى، أو أنشئ مستوى مخصصاً جديداً من الزر أعلاه.</p>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
                                {roles.map((role) => {
                                    const col = ROLE_COLORS[role.color] || ROLE_COLORS.slate;
                                    return (
                                        <div key={role.id} className={`bg-white rounded-2xl border ${col.card} p-5 shadow-sm space-y-4`}>
                                            <div className="flex items-start justify-between border-b border-slate-100 pb-3 gap-2">
                                                <div>
                                                    <h4 className={`font-extrabold ${col.head} text-sm`}>{role.name}</h4>
                                                    <span className={`inline-block mt-1 text-[10px] px-2 py-0.5 rounded font-bold border ${col.badge}`}>{role.nameAr}</span>
                                                </div>
                                                <div className="text-left shrink-0">
                                                    <div className="text-[10px] font-bold text-slate-500">{staffCount(role.name)} موظف</div>
                                                    <div className="flex gap-1 mt-1 justify-end">
                                                        <button onClick={() => setRoleModal(role)} title="تعديل" className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-600"><i data-lucide="sliders" className="w-3.5 h-3.5"></i></button>
                                                        {!role.system && (
                                                            <button onClick={() => handleDeleteRole(role)} title="حذف" className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-600"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                            <p className="text-xs text-slate-500">{role.description || 'بدون وصف.'}</p>
                                            <div className="space-y-3 max-h-80 overflow-y-auto pr-1">
                                                {PERMISSION_CATALOG.map(group => (
                                                    <div key={group.module}>
                                                        <div className="text-[10px] font-extrabold text-slate-400 mb-1.5">{group.module}</div>
                                                        <div className="space-y-1.5">
                                                            {group.items.map(item => (
                                                                <label key={item.key} className="flex items-center gap-2.5 p-2 bg-slate-50 rounded-lg cursor-pointer hover:bg-slate-100 text-xs">
                                                                    <input type="checkbox" checked={role.permissions.includes(item.key)} onChange={() => togglePermission(role.id, item.key)} className="w-4 h-4" />
                                                                    <span className="font-semibold text-slate-800">{item.label}</span>
                                                                </label>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {isStaffModalOpen && (
                        <StaffFormModal roles={roles} nextId={nextStaffId} onClose={() => setIsStaffModalOpen(false)} onSave={handleSaveStaff} />
                    )}
                    {roleModal && (
                        <RoleBuilderModal
                            role={roleModal === 'new' ? null : roleModal}
                            existingNames={roles.map(r => r.name)}
                            onClose={() => setRoleModal(null)}
                            onSave={handleSaveRole}
                        />
                    )}
                </div>
            );
        }

        // =====================================================================
        // COURSE OFFERING MODAL (Lecture by faculty, Sections/Labs by TAs)
        // =====================================================================
        const KIND_META = {
            lecture: { label: 'محاضرة', badge: 'bg-blue-100 text-blue-900 border-blue-200', who: 'عضو هيئة تدريس' },
            section: { label: 'سكشن', badge: 'bg-emerald-100 text-emerald-900 border-emerald-200', who: 'مدرس مساعد / معيد' },
            lab: { label: 'معمل', badge: 'bg-purple-100 text-purple-900 border-purple-200', who: 'مدرس مساعد / معيد' },
        };
        const daysOverlap = (a, b) => {
            const A = (a || '').split('/').map(x => x.trim()).filter(Boolean);
            const B = (b || '').split('/').map(x => x.trim()).filter(Boolean);
            return A.some(d => B.includes(d));
        };

        function CourseOfferingModal({ activeSemester, courses, instructors, initialOffering, onClose, onSave }) {
            const faculty = instructors.filter(i => FACULTY_TITLES.includes(i.title));
            const assistants = instructors.filter(i => ASSISTANT_TITLES.includes(i.title));

            const [selectedCourseCode, setSelectedCourseCode] = useState(initialOffering ? initialOffering.courseCode : courses[0]?.code || '');
            const selectedCourseObj = courses.find(c => c.code === selectedCourseCode);

            const [sections, setSections] = useState(() => {
                if (initialOffering) {
                    return initialOffering.sections.map(s => {
                        // normalise legacy records (old "type" strings) into the simplified kind/label model
                        if (s.kind) return { ...s };
                        const kind = /Lab/.test(s.type) ? 'lab' : /Lecture/.test(s.type) ? 'lecture' : 'section';
                        return { ...s, kind, label: KIND_META[kind].label, practicalMarks: s.practicalMarks || 0 };
                    });
                }
                return [{ id: 'LEC', kind: 'lecture', label: 'محاضرة', instructorId: faculty[0]?.id || '', days: 'الأحد / الثلاثاء', time: '09:00 - 10:30', room: 'مدرج 1', capacity: 100, enrolled: 0, practicalMarks: 0 }];
            });
            const [errors, setErrors] = useState([]);

            const renumber = (list) => {
                const counters = { section: 0, lab: 0 };
                return list.map(s => {
                    if (s.kind === 'lecture') return { ...s, label: 'محاضرة' };
                    counters[s.kind] += 1;
                    return { ...s, label: `${KIND_META[s.kind].label} ${counters[s.kind]}`, id: `${s.kind === 'lab' ? 'LAB' : 'SEC'}-${counters[s.kind]}` };
                });
            };

            const addSection = (kind) => {
                const ta = assistants[0]?.id || '';
                const isLab = kind === 'lab';
                const newSec = {
                    id: `NEW-${Date.now()}`, kind, label: '', instructorId: ta,
                    days: isLab ? 'الأربعاء' : 'الإثنين', time: isLab ? '11:00 - 01:00' : '11:00 - 12:30',
                    room: isLab ? 'معمل حاسب 1' : 'قاعة 101', capacity: isLab ? 30 : 35, enrolled: 0,
                    practicalMarks: isLab ? (selectedCourseObj?.practicalMarks || 0) : 0
                };
                setSections(renumber([...sections, newSec]));
            };
            const updateSection = (index, field, value) => {
                setSections(sections.map((s, i) => i === index ? { ...s, [field]: (field === 'capacity' || field === 'practicalMarks') ? Number(value) : value } : s));
            };
            const removeSection = (index) => setSections(renumber(sections.filter((_, i) => i !== index)));

            const validate = () => {
                const errs = [];
                const lecture = sections.find(s => s.kind === 'lecture');
                if (!lecture || !lecture.instructorId) errs.push('يجب تحديد أستاذ المادة (عضو هيئة تدريس) للمحاضرة.');
                sections.forEach(s => {
                    if (!s.instructorId) errs.push(`حدد المحاضر / المعيد المسؤول عن (${s.label}).`);
                    if (!s.days.trim() || !s.time.trim() || !s.room.trim()) errs.push(`أكمل الموعد والقاعة الخاصة بـ (${s.label}).`);
                    if (s.kind !== 'lecture' && s.practicalMarks > (selectedCourseObj?.practicalMarks || 0)) errs.push(`درجة العملي في (${s.label}) تتجاوز الحد الأقصى للمقرر (${selectedCourseObj?.practicalMarks}).`);
                });
                for (let i = 0; i < sections.length; i++) {
                    for (let j = i + 1; j < sections.length; j++) {
                        const a = sections[i], b = sections[j];
                        if (a.time.trim() === b.time.trim() && daysOverlap(a.days, b.days)) {
                            if (a.room.trim() === b.room.trim()) errs.push(`تعارض قاعة: (${a.label}) و (${b.label}) في نفس القاعة والوقت.`);
                            if (a.instructorId && a.instructorId === b.instructorId) errs.push(`تعارض مواعيد: نفس المحاضر مسند لـ (${a.label}) و (${b.label}) في نفس الوقت.`);
                        }
                    }
                }
                setErrors(errs);
                return errs.length === 0;
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!validate()) return;
                const totalCap = sections.reduce((a, s) => a + s.capacity, 0);
                const totalEnrolled = sections.reduce((a, s) => a + s.enrolled, 0);
                onSave({
                    id: initialOffering ? initialOffering.id : `OFF-${selectedCourseCode}-${activeSemester.replace(' ', '')}`,
                    courseCode: selectedCourseCode,
                    semesterId: activeSemester,
                    academicYear: '2024/2025',
                    status: totalCap > 0 && totalEnrolled >= totalCap ? 'Closed' : 'Open',
                    sections
                });
            };

            const inputCls = 'w-full bg-white border border-slate-300 rounded-lg px-2.5 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500';

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                    <form onSubmit={handleSubmit} className="bg-white rounded-3xl w-full max-w-4xl shadow-2xl border border-slate-200 overflow-hidden my-6">
                        <div className="p-5 bg-slate-900 text-white flex items-center justify-between">
                            <div>
                                <h3 className="text-base font-extrabold">استمارة طرح مقرر بالجدول الدراسي</h3>
                                <p className="text-[11px] text-slate-400">أستاذ المادة للمحاضرة - والمعيدون / المدرسون المساعدون للسكاشن والمعامل مع المواعيد والقاعات ودرجات العملي.</p>
                            </div>
                            <button type="button" onClick={onClose} title="إغلاق" className="p-1.5 rounded-lg hover:bg-white/10"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>

                        <div className="p-6 space-y-5 text-xs">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                                <div className="md:col-span-2">
                                    <label className="block font-bold mb-1">المقرر (من كتالوج المقررات)</label>
                                    <select
                                        value={selectedCourseCode}
                                        disabled={!!initialOffering}
                                        onChange={(e) => setSelectedCourseCode(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 font-bold disabled:bg-slate-100"
                                    >
                                        {courses.map(c => <option key={c.id} value={c.code}>{c.code} - {c.nameAr} ({c.dept} - {c.credits} ساعات)</option>)}
                                    </select>
                                </div>
                                <div className="bg-blue-50 border border-blue-200 rounded-xl px-3 py-2 font-bold text-blue-900 text-[11px] leading-relaxed">
                                    {selectedCourseObj ? `${LEVEL_LABELS[selectedCourseObj.level]} · محاضرة ${selectedCourseObj.lect}س / معمل ${selectedCourseObj.lab}س / سكشن ${selectedCourseObj.tut}س · عملي ${selectedCourseObj.practicalMarks} درجة` : ''}
                                </div>
                            </div>

                            {errors.length > 0 && (
                                <div className="bg-rose-50 border border-rose-200 text-rose-800 rounded-xl p-3 space-y-1 font-bold">
                                    {errors.map((er, i) => <div key={i}>• {er}</div>)}
                                </div>
                            )}

                            <div className="space-y-3">
                                {sections.map((sec, idx) => {
                                    const options = sec.kind === 'lecture' ? faculty : assistants;
                                    return (
                                        <div key={sec.id + idx} className="border border-slate-200 rounded-2xl p-4 bg-slate-50/60 space-y-3">
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-2">
                                                    <span className={`px-3 py-1 rounded-lg border text-[11px] font-extrabold ${KIND_META[sec.kind].badge}`}>{sec.label}</span>
                                                    <span className="text-[10px] text-slate-500 font-bold">يُسند إلى: {KIND_META[sec.kind].who}</span>
                                                </div>
                                                {sec.kind !== 'lecture' && (
                                                    <button type="button" onClick={() => removeSection(idx)} className="text-rose-600 hover:bg-rose-50 p-1.5 rounded-lg" title="حذف"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                )}
                                            </div>
                                            <div className="grid grid-cols-2 md:grid-cols-6 gap-3">
                                                <div className="md:col-span-2">
                                                    <label className="block text-[10px] font-bold text-slate-500 mb-1">{sec.kind === 'lecture' ? 'أستاذ المادة' : 'المعيد / المدرس المساعد'}</label>
                                                    <select value={sec.instructorId} onChange={e => updateSection(idx, 'instructorId', e.target.value)} className={inputCls}>
                                                        <option value="">— اختر —</option>
                                                        {options.map(ins => <option key={ins.id} value={ins.id}>{ins.name} ({ins.title})</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold text-slate-500 mb-1">الأيام</label>
                                                    <input value={sec.days} onChange={e => updateSection(idx, 'days', e.target.value)} className={inputCls} />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold text-slate-500 mb-1">التوقيت</label>
                                                    <input value={sec.time} onChange={e => updateSection(idx, 'time', e.target.value)} className={`${inputCls} font-mono`} />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold text-slate-500 mb-1">القاعة / المعمل</label>
                                                    <input value={sec.room} onChange={e => updateSection(idx, 'room', e.target.value)} className={inputCls} />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold text-slate-500 mb-1">السعة</label>
                                                    <input type="number" min="1" value={sec.capacity} onChange={e => updateSection(idx, 'capacity', e.target.value)} className={inputCls} />
                                                </div>
                                                {sec.kind !== 'lecture' && (
                                                    <div className="md:col-span-2">
                                                        <label className="block text-[10px] font-bold text-slate-500 mb-1">درجة العملي التي يرصدها ({sec.label}) - الحد الأقصى {selectedCourseObj?.practicalMarks}</label>
                                                        <input type="number" min="0" max={selectedCourseObj?.practicalMarks || 100} value={sec.practicalMarks} onChange={e => updateSection(idx, 'practicalMarks', e.target.value)} className={inputCls} />
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="flex gap-2">
                                <button type="button" onClick={() => addSection('section')} className="px-4 py-2 rounded-xl bg-emerald-50 text-emerald-800 border border-emerald-200 font-extrabold hover:bg-emerald-100">+ إضافة سكشن</button>
                                <button type="button" onClick={() => addSection('lab')} className="px-4 py-2 rounded-xl bg-purple-50 text-purple-800 border border-purple-200 font-extrabold hover:bg-purple-100">+ إضافة معمل</button>
                            </div>
                        </div>

                        <div className="bg-slate-100 px-6 py-4 border-t border-slate-200 flex items-center justify-between">
                            <button type="button" onClick={onClose} className="px-5 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 text-xs font-bold hover:bg-slate-50">إلغاء</button>
                            <button type="submit" className="px-6 py-2.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white text-xs font-extrabold shadow-md">حفظ الطرح والجدول</button>
                        </div>
                    </form>
                </div>
            );
        }

        // =====================================================================
        // TEACHING LOAD (per instructor across all levels)
        // =====================================================================
        function TeachingLoadView({ activeSemester, instructors, termOfferings, courses, searchQuery, showToast }) {
            const [levelFilter, setLevelFilter] = useState('ALL');
            const [expandedId, setExpandedId] = useState(null);

            const loadMatrix = useMemo(() => {
                return instructors.map(ins => {
                    const assigned = [];
                    termOfferings.filter(off => off.semesterId === activeSemester).forEach(off => {
                        const course = courses.find(c => c.code === off.courseCode);
                        off.sections.forEach(sec => {
                            if (sec.instructorId !== ins.id) return;
                            const kind = sec.kind || (/Lab/.test(sec.type) ? 'lab' : /Lecture/.test(sec.type) ? 'lecture' : 'section');
                            const hours = kind === 'lecture' ? (course?.lect ?? 3) : kind === 'lab' ? (course?.lab ?? 2) : (course?.tut ?? 1);
                            assigned.push({
                                courseCode: off.courseCode, courseName: course?.nameAr || off.courseCode, level: course?.level || 0,
                                kind, label: sec.label || KIND_META[kind].label, hours, days: sec.days, time: sec.time, room: sec.room
                            });
                        });
                    });

                    const byLevel = { 1: 0, 2: 0, 3: 0, 4: 0 };
                    assigned.forEach(a => { if (byLevel[a.level] !== undefined) byLevel[a.level] += a.hours; });
                    const assignedHours = assigned.reduce((acc, a) => acc + a.hours, 0);
                    let conflicts = 0;
                    for (let i = 0; i < assigned.length; i++) {
                        for (let j = i + 1; j < assigned.length; j++) {
                            if (assigned[i].time === assigned[j].time && daysOverlap(assigned[i].days, assigned[j].days)) conflicts++;
                        }
                    }
                    const isOverloaded = assignedHours > ins.maxHours;
                    const isUnderload = assignedHours < (ins.maxHours * 0.5);
                    const courseCount = new Set(assigned.map(a => a.courseCode)).size;
                    return { ...ins, assigned, byLevel, assignedHours, conflicts, isOverloaded, isUnderload, courseCount };
                });
            }, [instructors, termOfferings, courses, activeSemester]);

            const filteredMatrix = useMemo(() => {
                return loadMatrix.filter(m => {
                    const q = (searchQuery || '').toLowerCase();
                    const matchQ = !q || m.name.includes(searchQuery) || m.code.toLowerCase().includes(q);
                    const matchL = levelFilter === 'ALL' || m.byLevel[levelFilter] > 0;
                    return matchQ && matchL;
                });
            }, [loadMatrix, searchQuery, levelFilter]);

            const levelTotals = [1, 2, 3, 4].map(l => ({ level: l, hours: loadMatrix.reduce((a, m) => a + m.byLevel[l], 0) }));

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div>
                            <h1 className="text-2xl font-extrabold text-slate-900">لوحة الأعباء التدريسية (Teaching Load Dashboard)</h1>
                            <p className="text-slate-500 text-sm mt-1">
                                قياس العبء التدريسي المكتمل لكل محاضر ومعيد عبر كافة الفرق الدراسية، مع رصد تجاوز النصاب وتعارض المواعيد.
                            </p>
                        </div>
                        <span className="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">
                            {activeSemester === 'Fall 2024' ? 'خريف 2024' : activeSemester === 'Spring 2025' ? 'ربيع 2025' : 'صيف 2025'}
                        </span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-5">
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                            <span className="text-xs font-bold text-slate-400">إجمالي الساعات المسندة بالفصل:</span>
                            <div className="text-2xl font-black text-blue-900">{loadMatrix.reduce((acc, m) => acc + m.assignedHours, 0)} ساعة أسبوعية</div>
                        </div>
                        <div className="bg-emerald-50 border border-emerald-200 p-5 rounded-2xl space-y-2">
                            <span className="text-xs font-bold text-emerald-800">ضمن النصاب المتوازن:</span>
                            <div className="text-2xl font-black text-emerald-950">{loadMatrix.filter(m => !m.isOverloaded && !m.isUnderload).length} محاضر</div>
                        </div>
                        <div className="bg-rose-50 border border-rose-200 p-5 rounded-2xl space-y-2">
                            <span className="text-xs font-bold text-rose-800">تجاوز النصاب (Overloaded):</span>
                            <div className="text-2xl font-black text-rose-950">{loadMatrix.filter(m => m.isOverloaded).length} محاضر</div>
                        </div>
                        <div className="bg-amber-50 border border-amber-200 p-5 rounded-2xl space-y-2">
                            <span className="text-xs font-bold text-amber-800">تعارض مواعيد مكتشف:</span>
                            <div className="text-2xl font-black text-amber-950">{loadMatrix.reduce((a, m) => a + m.conflicts, 0)} حالة</div>
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded-2xl border border-slate-200 flex flex-wrap items-center gap-3 text-xs font-bold">
                        <span className="text-slate-500">عرض حسب الفرقة:</span>
                        {[{ id: 'ALL', label: 'كل الفرق' }, ...[1, 2, 3, 4].map(l => ({ id: l, label: `${LEVEL_LABELS[l]} (${levelTotals[l - 1].hours}س)` }))].map(t => (
                            <button key={t.id} onClick={() => setLevelFilter(t.id)}
                                className={`px-4 py-2 rounded-xl transition ${levelFilter === t.id ? 'bg-blue-700 text-white shadow' : 'text-slate-600 bg-slate-100 hover:bg-slate-200'}`}>
                                {t.label}
                            </button>
                        ))}
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-xs">
                                <thead className="bg-slate-100 text-slate-700 font-extrabold border-b border-slate-200">
                                    <tr>
                                        <th className="p-4">الكود والاسم</th>
                                        <th className="p-4">الدرجة والتعاقد</th>
                                        {[1, 2, 3, 4].map(l => <th key={l} className="p-4 text-center">ف{l}</th>)}
                                        <th className="p-4 text-center">العبء / الحد الأقصى</th>
                                        <th className="p-4 text-center">الحالة</th>
                                        <th className="p-4 text-center">التفاصيل</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-200">
                                    {filteredMatrix.map((ins) => {
                                        const percent = ins.maxHours > 0 ? Math.round((ins.assignedHours / ins.maxHours) * 100) : 0;
                                        const open = expandedId === ins.id;
                                        return (
                                            <React.Fragment key={ins.id}>
                                                <tr className="hover:bg-slate-50 transition">
                                                    <td className="p-4 font-bold text-slate-900">
                                                        <span className="font-mono text-blue-700 block text-[11px]">{ins.code}</span>
                                                        <span>{ins.name}</span>
                                                    </td>
                                                    <td className="p-4">
                                                        <span className="font-semibold text-slate-800">{ins.title}</span>
                                                        <span className="block text-[10px] text-slate-400">{ins.dept} ({ins.employmentType})</span>
                                                    </td>
                                                    {[1, 2, 3, 4].map(l => (
                                                        <td key={l} className="p-4 text-center font-mono font-bold">
                                                            {ins.byLevel[l] > 0 ? <span className="bg-blue-50 text-blue-800 border border-blue-200 px-2 py-0.5 rounded-lg">{ins.byLevel[l]}س</span> : <span className="text-slate-300">—</span>}
                                                        </td>
                                                    ))}
                                                    <td className="p-4 text-center font-bold">
                                                        <div className="w-28 mx-auto space-y-1">
                                                            <div className="font-mono text-xs"><strong className={ins.isOverloaded ? 'text-rose-600' : 'text-slate-900'}>{ins.assignedHours}</strong> / {ins.maxHours} ساعة</div>
                                                            <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                                                <div className={`h-full ${ins.isOverloaded ? 'bg-rose-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(percent, 100)}%` }}></div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td className="p-4 text-center space-y-1">
                                                        {ins.isOverloaded ? (
                                                            <span className="block bg-rose-100 text-rose-800 px-2.5 py-1 rounded-full text-[10px] font-extrabold border border-rose-200">متجاوز للنصاب</span>
                                                        ) : ins.isUnderload ? (
                                                            <span className="block bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full text-[10px] font-bold">تحت النصاب</span>
                                                        ) : (
                                                            <span className="block bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-[10px] font-bold">نصاب متوازن</span>
                                                        )}
                                                        {ins.conflicts > 0 && <span className="block bg-orange-100 text-orange-800 px-2 py-0.5 rounded-full text-[10px] font-bold">تعارض مواعيد ({ins.conflicts})</span>}
                                                    </td>
                                                    <td className="p-4 text-center">
                                                        <button onClick={() => setExpandedId(open ? null : ins.id)} className="text-blue-700 hover:bg-blue-50 px-3 py-1.5 rounded-lg font-bold">
                                                            {open ? 'إخفاء' : `عرض (${ins.assigned.length})`}
                                                        </button>
                                                    </td>
                                                </tr>
                                                {open && (
                                                    <tr className="bg-slate-50/70">
                                                        <td colSpan="9" className="p-4">
                                                            {ins.assigned.length === 0 ? (
                                                                <span className="text-slate-400 italic">لم يتم إسناد مواد لهذا الفصل بعد.</span>
                                                            ) : (
                                                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
                                                                    {ins.assigned.map((a, i) => (
                                                                        <div key={i} className="bg-white border border-slate-200 rounded-xl p-3 space-y-1">
                                                                            <div className="flex items-center justify-between">
                                                                                <span className="font-mono font-extrabold text-blue-700">{a.courseCode}</span>
                                                                                <span className={`px-2 py-0.5 rounded-lg border text-[10px] font-extrabold ${KIND_META[a.kind].badge}`}>{a.label}</span>
                                                                            </div>
                                                                            <div className="font-bold text-slate-800">{a.courseName}</div>
                                                                            <div className="text-[11px] text-slate-500">{LEVEL_LABELS[a.level]} · {a.hours} ساعة أسبوعياً</div>
                                                                            <div className="text-[11px] text-slate-600 font-semibold">{a.days} · {a.time} · {a.room}</div>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            )}
                                                        </td>
                                                    </tr>
                                                )}
                                            </React.Fragment>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

                            <button onClick={onClose} title="إغلاق" className="p-2 rounded-xl bg-white/10 hover:bg-white/20 shrink-0"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>

                        <div className="p-6 space-y-6 text-xs">
                            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                                {[
                                    { label: 'الطلاب المقيدون', value: students.length, cls: 'bg-blue-50 border-blue-200 text-blue-900' },

                                    { label: 'الأقسام العلمية', value: departments.length, cls: 'bg-rose-50 border-rose-200 text-rose-900' },

                return { totalStudents, warnedStudents, pendingOverrides, publishedCourses, courseCodes };

                const rows = studentGrades.filter(g => g.courseCode === code);

                    { label: 'أعمال السنة', done: all(g => g.yearWorkLocked) },

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-5">

                                <span className="text-slate-400 text-xs font-bold">إجمالي الطلاب المقيدين:</span>
