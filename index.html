                            <span className="text-[10px] text-rose-500 font-bold">يتطلب متابعة الإرشاد الأكاديمي</span>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                            <div className="flex items-center justify-between">
                                <span className="text-slate-400 text-xs font-bold">طلبات الاستثناء المعلقة:</span>
                                <div className="p-2 bg-amber-50 text-amber-700 rounded-xl"><i data-lucide="clock" className="w-4 h-4"></i></div>
                            </div>
                            <div className="text-2xl font-black text-amber-800">{stats.pendingOverrides} طلب</div>
                            <span className="text-[10px] text-amber-600 font-bold">قيد مراجعة العميد/الكنترول</span>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                            <div className="flex items-center justify-between">
                                <span className="text-slate-400 text-xs font-bold">مقررات نتيجتها منشورة:</span>
                                <div className="p-2 bg-emerald-50 text-emerald-700 rounded-xl"><i data-lucide="check-circle-2" className="w-4 h-4"></i></div>
                            </div>
                            <div className="text-2xl font-black text-emerald-800">{stats.publishedCourses} من {stats.courseCodes.length} مقررات</div>
                            <span className="text-[10px] text-emerald-600 font-bold">متاحة على بوابات الطلاب</span>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <div className="flex items-center justify-between">
                                <h3 className="font-extrabold text-slate-900 text-sm">مسار الكنترول لكل مقرر</h3>
                                <button onClick={() => setActiveNav('Control & Grading')} className="text-xs font-bold text-blue-700 hover:underline flex items-center gap-1">
                                    <span>فتح الكنترول</span><i data-lucide="arrow-left" className="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                            <div className="space-y-3">
                                {pipeline.map(p => (
                                    <div key={p.code} className="border border-slate-200 rounded-xl p-3 space-y-2">
                                        <div className="flex items-center justify-between text-xs">
                                            <span className="font-bold text-slate-900"><span className="font-mono text-blue-700">{p.code}</span> · {p.name}</span>
                                            <span className="text-slate-500 font-semibold">{p.count} طالب</span>
                                        </div>
                                        <div className="grid grid-cols-5 gap-1.5">
                                            {p.steps.map(st => (
                                                <div key={st.label} className={`text-center text-[10px] font-bold py-1.5 rounded-lg border ${st.done ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                                    {st.done ? '✔ ' : ''}{st.label}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <h3 className="font-extrabold text-slate-900 text-sm">الدفعات وأعداد الطلاب</h3>
                            <div className="space-y-3">
                                {cohortRows.map(c => (
                                    <div key={c.id} className="space-y-1">
                                        <div className="flex justify-between text-xs font-bold text-slate-700">
                                            <span>{c.code} <span className="text-slate-400 font-semibold">({LEVEL_LABELS[c.level]})</span></span>
                                            <span>{c.totalStudents} طالب</span>
                                        </div>
                                        <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                                            <div className="h-full bg-blue-600 rounded-full" style={{ width: `${maxCohort ? Math.round((c.totalStudents / maxCohort) * 100) : 0}%` }}></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {[
                            { icon: 'book-open', title: 'إدارة اللوائح والكتالوج', text: 'ضبط قواعد الساعات المعتمدة، شروط الترقية بين الفرق، وبناء سلم التقديرات.', nav: 'Academic Setup', cta: 'الانتقال للهيكل الأكاديمي' },
                            { icon: 'user-check', title: 'تسجيل الطلاب والتخصصات', text: 'قيد الطلاب الجدد، متابعة المحذرين، وتنفيذ محرك الترقية والتشعيب (CS, IS, IT).', nav: 'Students & Cohorts', cta: 'الانتقال لإدارة الطلاب' },
                            { icon: 'file-spreadsheet', title: 'أعمال الكنترول والنتائج', text: 'رصد أعمال السنة (40%)، درجات الفاينل (60%)، محرك الرأفة، ونشر النتيجة.', nav: 'Control & Grading', cta: 'دخول قسم الكنترول' },
                        ].map(card => (
                            <div key={card.nav} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                <h3 className="font-extrabold text-slate-900 text-sm flex items-center gap-2">
                                    <i data-lucide={card.icon} className="w-4 h-4 text-blue-700"></i><span>{card.title}</span>
                                </h3>
                                <p className="text-xs text-slate-500 leading-relaxed">{card.text}</p>
                                <button onClick={() => setActiveNav(card.nav)} className="text-xs font-bold text-blue-700 hover:underline flex items-center gap-1">
                                    <span>{card.cta}</span><i data-lucide="arrow-left" className="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // =====================================================================
        // CONTROL & GRADING  (3 screens - 40% year-work / 60% final)
        // =====================================================================
        function CourseSelect({ courses, value, onChange }) {
            return (
                <select value={value} onChange={(e) => onChange(e.target.value)} className="bg-slate-100 border border-slate-300 font-bold rounded-xl px-3 py-2 text-xs focus:bg-white">
                    {courses.map(c => <option key={c.id} value={c.code}>{c.code} - {c.nameAr}</option>)}
                </select>
            );
        }

        const RESET_RESULT = { processed: false, totalMark: null, letterGrade: null, points: null };

        // ---------------------------------------------------------------------
        // 1. Instructor assessment log (year-work 40)
        // ---------------------------------------------------------------------
        function InstructorAssessmentLogView({ courses, regulation, studentGrades, setStudentGrades, searchQuery, showToast }) {
            const rules = getControlRules(regulation);
            const [selCode, setSelectedCourseCode] = useState('CS101');
            const selectedCourseCode = courses.some(c => c.code === selCode) ? selCode : (courses[0]?.code || '');
            const [assessmentTab, setAssessmentTab] = useState('sheet'); // sheet | weekly | summary

            const currentCourseGrades = useMemo(() => studentGrades.filter(g => g.courseCode === selectedCourseCode), [studentGrades, selectedCourseCode]);
            const currentCourseObj = courses.find(c => c.code === selectedCourseCode);
            const midMax = (currentCourseObj?.midtermMarks ?? 10) + (currentCourseObj?.practicalMarks ?? 10);
            const isLocked = currentCourseGrades.length > 0 && currentCourseGrades.every(g => g.yearWorkLocked);

            const visibleGrades = useMemo(() => {
                if (!searchQuery) return currentCourseGrades;
                return currentCourseGrades.filter(g => g.studentName.includes(searchQuery) || g.academicId.includes(searchQuery));
            }, [currentCourseGrades, searchQuery]);

            const handleUpdateGrade = (gradeId, field, value) => {
                if (isLocked) { showToast('شيت أعمال السنة لهذه المادة مغلق وممرر للكنترول، لا يمكن التعديل إلا بإذن إداري!', 'error'); return; }
                const numVal = Math.max(0, Number(value));
                const maxByField = { attendanceMarks: ATTENDANCE_MAX, taskMarks: TASKS_MAX, midtermMarks: midMax };
                const labels = { attendanceMarks: 'درجة الحضور العمومي', taskMarks: 'درجة التكليفات', midtermMarks: 'درجة الميدتيرم/العملي' };
                if (numVal > maxByField[field]) {
                    showToast(`تنبيه: ${labels[field]} لا يجب أن تتجاوز ${maxByField[field]} درجة!`, 'error');
                    return;
                }
                setStudentGrades(prev => prev.map(g => g.id === gradeId ? { ...g, [field]: numVal, ...RESET_RESULT } : g));
            };

            const handleToggleWeeklyLog = (gradeId, weekKey) => {
                if (isLocked) { showToast('سجل الحضور مغلق بعد تمرير الشيت للكنترول.', 'error'); return; }
                setStudentGrades(prev => prev.map(g => {
                    if (g.id !== gradeId) return g;
                    const cur = (g.weeklyLogs && g.weeklyLogs[weekKey]) || 'P';
                    const next = cur === 'P' ? 'A' : cur === 'A' ? 'L' : 'P';
                    const logs = { ...(g.weeklyLogs || {}), [weekKey]: next };
                    return { ...g, weeklyLogs: logs, attendanceMarks: attendanceMarksFromLogs(logs), ...RESET_RESULT };
                }));
            };

            const handleLockYearWork = () => {
                setStudentGrades(prev => prev.map(g => g.courseCode === selectedCourseCode ? { ...g, yearWorkLocked: true } : g));
                showToast(`تم إغلاق وتجميد شيت أعمال السنة للمادة (${selectedCourseCode}) بنسبة ${rules.yearWorkMax}% وتمريره رسمياً للكنترول!`);
            };

            const summaries = useMemo(() => currentCourseGrades.map(g => ({ g, s: summarizeLogs(g.weeklyLogs) })), [currentCourseGrades]);
            const weekly = WEEK_KEYS.map(w => {
                const vals = currentCourseGrades.map(g => (g.weeklyLogs && g.weeklyLogs[w]) || 'P');
                return { key: w, present: vals.filter(v => v === 'P').length, late: vals.filter(v => v === 'L').length, absent: vals.filter(v => v === 'A').length };
            });
            const avgAttendance = summaries.length ? Math.round(summaries.reduce((a, x) => a + x.s.percent, 0) / summaries.length) : 0;
            const totalAbsences = summaries.reduce((a, x) => a + x.s.absent, 0);
            const atRisk = summaries.filter(x => x.s.absencePercent >= rules.absenceLimitPercent).length;

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div>
                            <div className="flex items-center gap-2 flex-wrap">
                                <h1 className="text-2xl font-extrabold text-slate-900">1. شاشة رصد درجات المحاضر ({rules.yearWorkMax}% أعمال سنة)</h1>
                                {isLocked ? (
                                    <span className="bg-rose-100 text-rose-800 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1"><i data-lucide="lock" className="w-3.5 h-3.5"></i>شيت أعمال السنة مغلق وممرر للكنترول</span>
                                ) : (
                                    <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1"><i data-lucide="edit" className="w-3.5 h-3.5"></i>مفتوح لرصد المحاضر</span>
                                )}
                            </div>
                            <p className="text-slate-500 text-sm mt-1">رصد الحضور العمومي، التكليفات، ودرجات الميدتيرم/العملي (إجمالي {rules.yearWorkMax} درجة) قبل تمرير المادة للكنترول للفاينل ({rules.finalMax} درجة).</p>
                        </div>
                        <div className="flex items-center gap-3 flex-wrap">
                            <div className="flex items-center gap-2">
                                <span className="text-xs font-bold text-slate-600">المقرر:</span>
                                <CourseSelect courses={courses} value={selectedCourseCode} onChange={setSelectedCourseCode} />
                            </div>
                            <button
                                onClick={handleLockYearWork}
                                disabled={isLocked || currentCourseGrades.length === 0}
                                className={`px-4 py-2.5 rounded-xl font-bold text-xs shadow transition flex items-center gap-2 ${isLocked || currentCourseGrades.length === 0 ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-rose-600 hover:bg-rose-700 text-white'}`}
                            >
                                <i data-lucide="lock" className="w-4 h-4"></i>
                                <span>اعتماد وقفل شيت {rules.yearWorkMax}% أعمال السنة</span>
                            </button>
                        </div>
                    </div>

                    <div className="bg-blue-900 text-white p-5 rounded-2xl shadow flex items-center justify-between text-xs gap-4 flex-wrap">
                        <div className="flex items-center gap-3">
                            <i data-lucide="calculator" className="w-6 h-6 text-blue-300"></i>
                            <div>
                                <h4 className="font-extrabold text-sm">توزيع الدرجات المعتمد باللائحة لمادة ({selectedCourseCode})</h4>
                                <p className="text-blue-200 text-[11px]">{rules.yearWorkMax}% أعمال سنة ({ATTENDANCE_MAX} حضور عمومي + {TASKS_MAX} تكليفات + {midMax} ميدتيرم/عملي) | {rules.finalMax}% الامتحان النهائي (Final Exam)</p>
                            </div>
                        </div>
                        <span className="bg-white/10 text-white px-3 py-1 rounded-lg font-mono font-bold">100 درجة كلية</span>
                    </div>

                    <div className="flex items-center gap-3 bg-white p-3 rounded-2xl border border-slate-200 text-xs font-bold flex-wrap">
                        {[
                            { id: 'sheet', label: 'شيت رصد الدرجات' },
                            { id: 'weekly', label: 'رصد الحضور الأسبوعي' },
                            { id: 'summary', label: 'ملخص الحضور والغياب العام' },
                        ].map(t => (
                            <button key={t.id} onClick={() => setAssessmentTab(t.id)} className={`px-4 py-2 rounded-xl transition ${assessmentTab === t.id ? 'bg-blue-700 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}>{t.label}</button>
                        ))}
                    </div>

                    {currentCourseGrades.length === 0 && (
                        <div className="bg-white rounded-2xl border border-slate-200 p-10 text-center text-slate-400 font-bold">لا توجد سجلات طلاب لهذا المقرر بعد.</div>
                    )}

                    {currentCourseGrades.length > 0 && assessmentTab === 'sheet' && (
                        <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm p-5">
                            <div className="overflow-x-auto">
                                <table className="w-full text-right text-xs">
                                    <thead className="bg-slate-100 text-slate-700 font-extrabold border-b border-slate-200">
                                        <tr>
                                            <th className="p-3">الكود الأكاديمي والاسم</th>
                                            <th className="p-3 text-center">الحضور العمومي ({ATTENDANCE_MAX})</th>
                                            <th className="p-3 text-center">التكليفات والمهام ({TASKS_MAX})</th>
                                            <th className="p-3 text-center">الميدتيرم والعملي ({midMax})</th>
                                            <th className="p-3 text-center bg-blue-50/80">مجموع أعمال السنة ({rules.yearWorkMax}%)</th>
                                            <th className="p-3 text-center">حالة الاعتماد</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200">
                                        {visibleGrades.map((g) => (
                                            <tr key={g.id} className="hover:bg-slate-50 transition">
                                                <td className="p-3 font-bold text-slate-900">
                                                    <span className="font-mono text-blue-700 block text-[11px]">{g.academicId}</span>
                                                    <span>{g.studentName}</span>
                                                </td>
                                                {[['attendanceMarks', ATTENDANCE_MAX], ['taskMarks', TASKS_MAX], ['midtermMarks', midMax]].map(([field, max]) => (
                                                    <td key={field} className="p-3 text-center">
                                                        <input
                                                            type="number" min="0" max={max} disabled={isLocked} value={g[field]}
                                                            onChange={(e) => handleUpdateGrade(g.id, field, e.target.value)}
                                                            className={`w-20 bg-slate-50 border border-slate-300 rounded-lg p-1.5 font-bold text-center focus:bg-white disabled:bg-slate-100 ${field === 'midtermMarks' ? 'text-blue-800' : ''}`}
                                                        />
                                                    </td>
                                                ))}
                                                <td className="p-3 text-center bg-blue-50/50 font-mono font-black text-blue-900 text-sm">{getYearWork(g)} / {rules.yearWorkMax}</td>
                                                <td className="p-3 text-center">
                                                    {g.yearWorkLocked
                                                        ? <span className="bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full text-[10px] font-extrabold">مُعتمد ومقفل</span>
                                                        : <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full text-[10px] font-bold">قيد الرصد</span>}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {currentCourseGrades.length > 0 && assessmentTab === 'weekly' && (
                        <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm p-5 space-y-4">
                            <div className="text-xs font-bold text-slate-700">سجل الحضور والغياب الأسبوعي (انقر للتنقل: حاضر P ← غائب A ← متأخر L). كل تعديل يحدّث درجة الحضور العمومي آلياً (P=1، L=½، A=0).</div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-right text-xs">
                                    <thead className="bg-slate-100 text-slate-700 font-extrabold border-b border-slate-200">
                                        <tr>
                                            <th className="p-3">اسم الطالب</th>
                                            {WEEK_KEYS.map((w, i) => <th key={w} className="p-3 text-center">أ{i + 1}</th>)}
                                            <th className="p-3 text-center">حاضر / غائب / متأخر</th>
                                            <th className="p-3 text-center">درجة الحضور</th>
                                            <th className="p-3 text-center">التنبيه</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200">
                                        {visibleGrades.map((g) => {
                                            const s = summarizeLogs(g.weeklyLogs);
                                            return (
                                                <tr key={g.id} className="hover:bg-slate-50">
                                                    <td className="p-3 font-bold text-slate-900">{g.studentName}</td>
                                                    {WEEK_KEYS.map((wKey) => {
                                                        const status = (g.weeklyLogs && g.weeklyLogs[wKey]) || 'P';
                                                        return (
                                                            <td key={wKey} className="p-2 text-center">
                                                                <button
                                                                    disabled={isLocked} onClick={() => handleToggleWeeklyLog(g.id, wKey)}
                                                                    className={`w-8 h-8 rounded-lg font-mono font-extrabold text-xs transition ${
                                                                        status === 'P' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' :
                                                                        status === 'A' ? 'bg-rose-100 text-rose-800 border border-rose-300' :
                                                                        'bg-amber-100 text-amber-800 border border-amber-300'
                                                                    } ${isLocked ? 'opacity-60 cursor-not-allowed' : ''}`}
                                                                >{status}</button>
                                                            </td>
                                                        );
                                                    })}
                                                    <td className="p-3 text-center font-mono font-bold"><span className="text-emerald-700">{s.present}</span> / <span className="text-rose-700">{s.absent}</span> / <span className="text-amber-700">{s.late}</span></td>
                                                    <td className="p-3 text-center font-mono font-extrabold text-blue-800">{g.attendanceMarks} / {ATTENDANCE_MAX}</td>
                                                    <td className="p-3 text-center">
                                                        {s.absencePercent >= rules.absenceLimitPercent
                                                            ? <span className="bg-rose-100 text-rose-800 px-2.5 py-1 rounded-full font-bold text-[10px]">⚠️ إنذار غياب ({s.absent} أسابيع)</span>
                                                            : <span className="text-emerald-700 font-bold text-[10px]">حضور منتظم</span>}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {currentCourseGrades.length > 0 && assessmentTab === 'summary' && (
                        <div className="space-y-5">
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-5">
                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1"><span className="text-xs font-bold text-slate-400 block">متوسط نسبة الحضور العامة:</span><span className="text-2xl font-black text-blue-900">{avgAttendance}%</span></div>
                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1"><span className="text-xs font-bold text-slate-400 block">إجمالي حالات الغياب:</span><span className="text-2xl font-black text-rose-700">{totalAbsences} غياب</span></div>
                                <div className="bg-rose-50 border border-rose-200 p-5 rounded-2xl space-y-1"><span className="text-xs font-bold text-rose-800 block">معرضون للحرمان (غياب ≥ {rules.absenceLimitPercent}%):</span><span className="text-2xl font-black text-rose-900">{atRisk} طالب</span></div>
                                <div className="bg-emerald-50 border border-emerald-200 p-5 rounded-2xl space-y-1"><span className="text-xs font-bold text-emerald-800 block">عدد أسابيع الرصد:</span><span className="text-2xl font-black text-emerald-900">{WEEK_KEYS.length} أسابيع</span></div>
                            </div>

                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-3">
                                <h3 className="font-extrabold text-slate-900 text-sm">الحضور والغياب العام لكل أسبوع (على مستوى المقرر)</h3>
                                <div className="grid grid-cols-4 md:grid-cols-8 gap-3">
                                    {weekly.map((w, i) => {
                                        const total = w.present + w.late + w.absent || 1;
                                        return (
                                            <div key={w.key} className="border border-slate-200 rounded-xl p-3 text-center space-y-2">
                                                <div className="text-[11px] font-bold text-slate-500">الأسبوع {i + 1}</div>
                                                <div className="w-full h-16 bg-slate-100 rounded-lg overflow-hidden flex flex-col-reverse">
                                                    <div className="bg-emerald-500" style={{ height: `${(w.present / total) * 100}%` }}></div>
                                                    <div className="bg-amber-400" style={{ height: `${(w.late / total) * 100}%` }}></div>
                                                    <div className="bg-rose-500" style={{ height: `${(w.absent / total) * 100}%` }}></div>
                                                </div>
                                                <div className="text-[10px] font-mono font-bold"><span className="text-emerald-700">{w.present}</span>/<span className="text-amber-700">{w.late}</span>/<span className="text-rose-700">{w.absent}</span></div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="flex gap-4 text-[10px] font-bold text-slate-500"><span className="text-emerald-600">■ حاضر</span><span className="text-amber-500">■ متأخر</span><span className="text-rose-600">■ غائب</span></div>
                            </div>

                            <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm p-5">
                                <table className="w-full text-right text-xs">
                                    <thead className="bg-slate-100 text-slate-700 font-extrabold border-b border-slate-200">
                                        <tr>
                                            <th className="p-3">الطالب</th>
                                            <th className="p-3 text-center">حضور</th>
                                            <th className="p-3 text-center">تأخير</th>
                                            <th className="p-3 text-center">غياب</th>
                                            <th className="p-3 text-center">نسبة الحضور</th>
                                            <th className="p-3 text-center">نسبة الغياب</th>
                                            <th className="p-3 text-center">الموقف</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200">
                                        {summaries.filter(x => !searchQuery || x.g.studentName.includes(searchQuery) || x.g.academicId.includes(searchQuery)).map(({ g, s }) => (
                                            <tr key={g.id} className="hover:bg-slate-50">
                                                <td className="p-3 font-bold text-slate-900"><span className="font-mono text-blue-700 block text-[11px]">{g.academicId}</span>{g.studentName}</td>
                                                <td className="p-3 text-center font-mono font-bold text-emerald-700">{s.present}</td>
                                                <td className="p-3 text-center font-mono font-bold text-amber-700">{s.late}</td>
                                                <td className="p-3 text-center font-mono font-bold text-rose-700">{s.absent}</td>
                                                <td className="p-3 text-center">
                                                    <div className="w-24 mx-auto space-y-1">
                                                        <div className="font-mono font-bold">{s.percent}%</div>
                                                        <div className="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className={`h-full ${s.percent >= 75 ? 'bg-emerald-500' : 'bg-rose-500'}`} style={{ width: `${s.percent}%` }}></div></div>
                                                    </div>
                                                </td>
                                                <td className="p-3 text-center font-mono font-bold">{s.absencePercent}%</td>
                                                <td className="p-3 text-center">
                                                    {s.absencePercent >= rules.absenceLimitPercent
                                                        ? <span className="bg-rose-100 text-rose-800 px-2.5 py-1 rounded-full font-extrabold text-[10px]">معرض للحرمان</span>
                                                        : s.absent > 0
                                                            ? <span className="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-bold text-[10px]">إنذار غياب</span>
                                                            : <span className="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-bold text-[10px]">منتظم</span>}
                                                </td>

                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ---------------------------------------------------------------------
        // 2. Grade processing engine (filters: level / semester / dept / course)
        // ---------------------------------------------------------------------
        function GradeProcessingEngineView({ courses, students, departments, regulation, studentGrades, setStudentGrades, searchQuery, showToast }) {
            const rules = getControlRules(regulation);
            const passMark = getPassMark(regulation);
            const minFinal = (rules.finalMax * rules.minFinalPercent) / 100;
            const scale = [...(regulation?.gradeScales || [])].sort((a, b) => b.minPercent - a.minPercent);

            const [filterLevel, setFilterLevel] = useState('ALL');
            const [filterSemester, setFilterSemester] = useState('Fall 2024');
            const [filterDept, setFilterDept] = useState('ALL');
            const [selectedCourseCode, setSelectedCourseCode] = useState('CS101');

            const filteredGrades = useMemo(() => {
                return studentGrades.filter(g => {
                    const matchCourse = selectedCourseCode === 'ALL' || g.courseCode === selectedCourseCode;
                    const matchSem = filterSemester === 'ALL' || g.semesterId === filterSemester;
                    const st = students.find(s => s.id === g.studentId);
                    const matchLevel = filterLevel === 'ALL' || (st && String(st.level) === String(filterLevel));
                    const matchDept = filterDept === 'ALL' || (st && st.dept === filterDept);
                    const matchQ = !searchQuery || g.studentName.includes(searchQuery) || g.academicId.includes(searchQuery);
                    return matchCourse && matchSem && matchLevel && matchDept && matchQ;
                });
            }, [studentGrades, students, selectedCourseCode, filterSemester, filterLevel, filterDept, searchQuery]);

            const ids = useMemo(() => new Set(filteredGrades.map(g => g.id)), [filteredGrades]);
            const approvedCount = filteredGrades.filter(g => g.isApproved).length;
            const unlockedCount = filteredGrades.filter(g => !g.yearWorkLocked).length;
            const letterCounts = useMemo(() => {
                const acc = {};
                filteredGrades.filter(g => g.processed).forEach(g => { acc[g.letterGrade] = (acc[g.letterGrade] || 0) + 1; });
                return acc;
            }, [filteredGrades]);

            const handleRunGradeAggregation = () => {
                if (filteredGrades.length === 0) { showToast('لا توجد سجلات مطابقة للفلاتر الحالية.', 'error'); return; }
                if (unlockedCount > 0) { showToast(`يوجد ${unlockedCount} سجل لم يُغلق شيت أعمال السنة له بعد (من شاشة رصد المحاضر).`, 'error'); return; }
                setStudentGrades(prev => prev.map(g => {
                    if (!ids.has(g.id) || g.isApproved) return g;
                    const res = computeGradeResult(g, regulation);
                    return { ...g, processed: true, totalMark: res.totalMark, letterGrade: res.letterGrade, points: res.points };
                }));
                showToast(`تم تشغيل محرك المعالجة وتجميع الدرجات (${rules.yearWorkMax}% أعمال سنة + ${rules.finalMax}% فاينل) وحساب التقديرات!`);
            };

            const canGrace = (g) => {
                if (!g.processed || g.isApproved || g.graceMarksApplied > 0) return false;
                const res = computeGradeResult(g, regulation);
                return res.passedFinal && res.totalMark < passMark && res.totalMark + rules.graceMarks >= passMark;
            };
            const handleApplyGraceMark = (gradeId) => {
                setStudentGrades(prev => prev.map(g => {
                    if (g.id !== gradeId) return g;
                    const updated = { ...g, graceMarksApplied: (g.graceMarksApplied || 0) + rules.graceMarks };
                    const res = computeGradeResult(updated, regulation);
                    return { ...updated, totalMark: res.totalMark, letterGrade: res.letterGrade, points: res.points };
                }));
                showToast(`تم منح الطالب ${rules.graceMarks} درجة رأفة معتمدة وتعديل التقدير للنجاح!`);
            };

            const selectCls = 'w-full bg-slate-100 border border-slate-300 rounded-xl p-2.5 focus:bg-white text-slate-800';

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div>
                            <div className="flex items-center gap-2 flex-wrap">
                                <h1 className="text-2xl font-extrabold text-slate-900">2. محرك المعالجة والنتائج والإنذارات (Grade Processing Engine)</h1>
                                <span className="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">محرك الحسابات الآلي</span>
                            </div>
                            <p className="text-slate-500 text-sm mt-1">معالجة الشيتات، تصفية البيانات حسب الفرقة والفصل والقسم، وتطبيق سلم الدرجات وقواعد الرأفة (+{rules.graceMarks}).</p>
                        </div>
                        <button onClick={handleRunGradeAggregation} className="bg-blue-700 hover:bg-blue-800 text-white px-5 py-2.5 rounded-xl font-extrabold text-xs shadow transition flex items-center gap-2 shrink-0">
                            <i data-lucide="calculator" className="w-4 h-4"></i>
                            <span>تشغيل محرك المعالجة الفوري</span>
                        </button>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <h4 className="font-extrabold text-xs text-slate-700 flex items-center gap-2">
                            <i data-lucide="filter" className="w-4 h-4 text-blue-700"></i>
                            <span>أدوات التصفية واختيار البيانات (Data Filters Bar):</span>
                        </h4>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs font-bold">
                            <div>
                                <label className="text-slate-500 block mb-1">الفرقة / المستوى الدراسي:</label>
                                <select value={filterLevel} onChange={(e) => setFilterLevel(e.target.value)} className={selectCls}>
                                    <option value="ALL">جميع الفرق (Levels 1 - 4)</option>
                                    {[1, 2, 3, 4].map(l => <option key={l} value={l}>{LEVEL_LABELS[l]} (Level {l})</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-slate-500 block mb-1">الفصل الدراسي (Semester):</label>
                                <select value={filterSemester} onChange={(e) => setFilterSemester(e.target.value)} className={selectCls}>
                                    <option value="ALL">جميع الفصول الدراسية</option>
                                    <option value="Fall 2024">فصل الخريف 2024 (Fall)</option>
                                    <option value="Spring 2025">فصل الربيع 2025 (Spring)</option>
                                    <option value="Summer 2025">الفصل الصيفي 2025 (Summer)</option>
                                </select>
                            </div>
                            <div>
                                <label className="text-slate-500 block mb-1">القسم العلمي (Department):</label>
                                <select value={filterDept} onChange={(e) => setFilterDept(e.target.value)} className={selectCls}>
                                    <option value="ALL">جميع الأقسام العلمية</option>
                                    {departments.map(d => <option key={d.id} value={d.code}>{d.nameAr} ({d.code})</option>)}
                                    <option value="عام (General)">المستوى الأول العام</option>
                                </select>
                            </div>
                            <div>
                                <label className="text-slate-500 block mb-1">المقرر الدراسي (Course):</label>
                                <select value={selectedCourseCode} onChange={(e) => setSelectedCourseCode(e.target.value)} className={`${selectCls} text-blue-900 font-extrabold`}>
                                    <option value="ALL">جميع المقررات الدراسية</option>
                                    {courses.map(c => <option key={c.id} value={c.code}>{c.code} - {c.nameAr}</option>)}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-2 gap-5 text-xs">
                        <div className="space-y-2">
                            <div className="font-extrabold text-slate-800">قواعد الكنترول المعتمدة (اللائحة {regulation?.code}):</div>
                            <div className="grid grid-cols-2 gap-3 font-semibold text-slate-700">
                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">توزيع الدرجات<div className="font-black text-blue-900 text-sm">{rules.yearWorkMax}% / {rules.finalMax}%</div></div>
                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">حد النجاح الكلي<div className="font-black text-blue-900 text-sm">{passMark} من 100</div></div>
                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">أدنى درجة بورقة الفاينل<div className="font-black text-blue-900 text-sm">{minFinal} من {rules.finalMax}</div></div>
                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">الرأفة المسموحة<div className="font-black text-blue-900 text-sm">+{rules.graceMarks} درجة</div></div>
                            </div>
                        </div>
                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-200 text-blue-900 leading-relaxed font-medium space-y-2">
                            <strong>سلم التقديرات والنقاط المعتمد:</strong>
                            <div className="flex flex-wrap gap-2">
                                {scale.map(sc => <span key={sc.grade} className="bg-white border border-blue-200 rounded-lg px-2.5 py-1 font-mono font-bold">{sc.grade} ({sc.minPercent}% - {Number(sc.points).toFixed(1)})</span>)}
                            </div>
                            {approvedCount > 0 && <p className="text-[11px] text-amber-800 font-bold">{approvedCount} سجل معتمد ومقفل لن تتأثر بإعادة المعالجة.</p>}
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm p-5 space-y-4">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-3 text-xs font-bold text-slate-700 flex-wrap gap-2">
                            <span>نتائج التجميع النهائي ({rules.yearWorkMax}% أعمال سنة + {rules.finalMax}% فاينل = 100%)</span>
                            <span className="flex items-center gap-3">
                                {Object.entries(letterCounts).map(([l, n]) => <span key={l} className="bg-slate-100 border border-slate-200 rounded-lg px-2 py-0.5 font-mono">{l}: {n}</span>)}
                                <span className="text-blue-700 font-extrabold">عدد السجلات المطابقة للفلاتر: {filteredGrades.length} طالب</span>
                            </span>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-xs">
                                <thead className="bg-slate-100 text-slate-700 font-extrabold border-b border-slate-200">
                                    <tr>
                                        <th className="p-3">الطالب والكود الأكاديمي</th>
                                        <th className="p-3 text-center">المقرر</th>
                                        <th className="p-3 text-center">أعمال السنة ({rules.yearWorkMax})</th>
                                        <th className="p-3 text-center">درجة الفاينل ({rules.finalMax})</th>
                                        <th className="p-3 text-center bg-blue-50">المجموع النهائي (100)</th>
                                        <th className="p-3 text-center">فحص شرط الفاينل</th>
                                        <th className="p-3 text-center">التقدير الحرفي</th>
                                        <th className="p-3 text-center">النقاط</th>
                                        <th className="p-3 text-center">قواعد الرأفة</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-200">
                                    {filteredGrades.length === 0 && (
                                        <tr><td colSpan="9" className="p-8 text-center text-slate-400 font-bold">لا توجد سجلات مطابقة للفلاتر.</td></tr>
                                    )}
                                    {filteredGrades.map((g) => {
                                        const passedFinalThreshold = !g.isAbsent && g.finalExamMark >= minFinal;
                                        return (
                                            <tr key={g.id} className="hover:bg-slate-50 transition">
                                                <td className="p-3 font-bold text-slate-900"><span>{g.studentName}</span><span className="block font-mono text-[10px] text-blue-700 font-bold">{g.academicId}</span></td>
                                                <td className="p-3 text-center font-mono font-bold text-slate-600">{g.courseCode}</td>
                                                <td className="p-3 text-center font-bold text-slate-700">{getYearWork(g)}</td>
                                                <td className="p-3 text-center font-bold text-purple-900">{g.isAbsent ? 'غائب' : g.finalExamMark}</td>
                                                <td className="p-3 text-center font-mono font-black text-blue-900 text-sm bg-blue-50">{g.processed ? g.totalMark : <span className="text-slate-300">—</span>}</td>
                                                <td className="p-3 text-center">
                                                    {passedFinalThreshold
                                                        ? <span className="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full text-[10px] font-bold">اجتاز الفاينل</span>
                                                        : <span className="bg-rose-100 text-rose-800 px-2.5 py-0.5 rounded-full text-[10px] font-extrabold">راسب فاينل</span>}
                                                </td>
                                                <td className="p-3 text-center">
                                                    {g.processed
                                                        ? <span className={`px-3 py-1 rounded-lg font-mono font-black text-xs ${g.letterGrade === 'A' ? 'bg-emerald-100 text-emerald-800' : g.letterGrade === 'F' ? 'bg-rose-100 text-rose-800' : 'bg-blue-100 text-blue-800'}`}>{g.letterGrade}</span>
                                                        : <span className="text-slate-300">—</span>}
                                                </td>
                                                <td className="p-3 text-center font-mono font-bold text-slate-800">{g.processed ? Number(g.points).toFixed(1) : '—'}</td>
                                                <td className="p-3 text-center">
                                                    {canGrace(g) ? (
                                                        <button onClick={() => handleApplyGraceMark(g.id)} className="bg-amber-500 hover:bg-amber-600 text-slate-950 px-2.5 py-1 rounded-xl font-black text-[10px] shadow transition">+{rules.graceMarks} رأفة للنجاح</button>
                                                    ) : g.graceMarksApplied > 0 ? (
                                                        <span className="text-amber-700 font-bold text-[10px]">تمت الرأفة ({g.graceMarksApplied})</span>
                                                    ) : <span className="text-slate-400 font-semibold">-</span>}
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // ---------------------------------------------------------------------
        // 3. Verification, lock, exam schedule & publishing
        // ---------------------------------------------------------------------
        function VerificationLockPublishView({ courses, regulation, students, setStudents, cohorts, studentGrades, setStudentGrades, showToast }) {
            const [selectedCourseCode, setSelectedCourseCode] = useState('CS101');
            const course = courses.find(c => c.code === selectedCourseCode);
            const credits = course?.credits || 3;

            const filteredGrades = useMemo(() => studentGrades.filter(g => g.courseCode === selectedCourseCode), [studentGrades, selectedCourseCode]);
            const allProcessed = filteredGrades.length > 0 && filteredGrades.every(g => g.processed);
            const isApproved = filteredGrades.length > 0 && filteredGrades.every(g => g.isApproved);
            const isPublished = filteredGrades.length > 0 && filteredGrades.every(g => g.isPublished);

            const analytics = useMemo(() => {
                const done = filteredGrades.filter(g => g.processed);
                const passCount = done.filter(g => g.letterGrade !== 'F').length;
                return { total: filteredGrades.length, passCount, failCount: done.length - passCount, passRate: done.length ? Math.round((passCount / done.length) * 100) : 0 };
            }, [filteredGrades]);

            // Exam schedule overview per level (counts from cohorts, status from real control sheets)
            const examSchedule = [1, 2, 3, 4].map(level => {
                const cohort = cohorts.find(c => c.level === level && c.status !== 'Upcoming');
                const levelStudentIds = new Set(students.filter(s => s.level === level).map(s => s.id));
                const rows = studentGrades.filter(g => levelStudentIds.has(g.studentId));
                const locked = rows.length > 0 && rows.every(g => g.isPublished);
                const started = rows.length > 0;
                return {
                    level, levelName: LEVEL_LABELS[level],
                    cohortCode: cohort ? cohort.code : '—',
                    totalStudents: cohort ? cohort.totalStudents : students.filter(s => s.level === level).length,
                    season: level === 4 ? 'امتحانات يناير / مايو / دور يوليو الاستثنائي' : 'امتحانات يناير (فصل الخريف) / امتحانات مايو (فصل الربيع)',
                    examStatus: locked ? 'مكتمل ومقفل نهائياً' : started ? 'قيد الرصد والاعتماد' : 'لم يبدأ الرصد بعد',
                    isLocked: locked
                };
            });

            const cgpaPreview = useMemo(() => filteredGrades.map(g => {
                const st = students.find(s => s.id === g.studentId);
                if (!st || !g.processed) return { g, st, projected: null };
                const prevCredits = st.passedCredits || 0;
                const projected = isPublished ? st.cgpa : Math.round(((st.cgpa * prevCredits + g.points * credits) / (prevCredits + credits)) * 100) / 100;
                return { g, st, projected };
            }), [filteredGrades, students, credits, isPublished]);

            const handleApproveAndLockControl = () => {
                if (!allProcessed) { showToast('يجب تشغيل محرك المعالجة لجميع طلاب المقرر قبل الاعتماد (شاشة 2).', 'error'); return; }
                setStudentGrades(prev => prev.map(g => g.courseCode === selectedCourseCode ? { ...g, isApproved: true } : g));
                showToast(`تم التوقيع والاعتماد النهائي لشيت الكنترول للمادة (${selectedCourseCode}) بواسطة رئيس الكنترول!`);
            };

            const handlePublishResults = () => {
                if (!isApproved) { showToast('يجب التوقيع والاعتماد النهائي للكنترول أولاً قبل نشر النتيجة للطلاب!', 'error'); return; }
                if (isPublished) return;
                const updates = {};
                filteredGrades.forEach(g => {
                    const st = students.find(s => s.id === g.studentId);
                    if (!st) return;
                    const prevCredits = st.passedCredits || 0;
                    updates[st.id] = {
                        cgpa: Math.round(((st.cgpa * prevCredits + g.points * credits) / (prevCredits + credits)) * 100) / 100,
                        passedCredits: prevCredits + (g.points > 0 ? credits : 0)
                    };
                });
                setStudents(prev => prev.map(s => updates[s.id] ? { ...s, ...updates[s.id] } : s));
                setStudentGrades(prev => prev.map(g => g.courseCode === selectedCourseCode ? { ...g, isPublished: true } : g));
                showToast(`تم نشر نتائج مادة (${selectedCourseCode}) بنجاح وتحديث المعدلات التراكمية (CGPA) والساعات المجتازة لجميع الطلاب!`);
            };

            const checklist = [
                { label: 'إغلاق أعمال السنة', ok: filteredGrades.length > 0 && filteredGrades.every(g => g.yearWorkLocked) },
                { label: 'رصد درجات الفاينل', ok: filteredGrades.length > 0 && filteredGrades.every(g => g.isAbsent || g.finalExamMark > 0) },
                { label: 'تشغيل محرك المعالجة', ok: allProcessed },
                { label: 'اعتماد رئيس الكنترول', ok: isApproved },
                { label: 'نشر النتيجة', ok: isPublished },
            ];

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div>
                            <div className="flex items-center gap-2 flex-wrap">
                                <h1 className="text-2xl font-extrabold text-slate-900">3. التوثيق وقفل الكنترول ومواعيد الامتحانات (Verification & Publishing)</h1>
                                <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full">الاعتماد وقفل الترم</span>
                            </div>
                            <p className="text-slate-500 text-sm mt-1">متابعة الفرق التي تمتحن ومواعيدها خلال السنة، مراجعة النسبة العامة، واعتماد النتيجة ونشرها.</p>
                        </div>
                        <CourseSelect courses={courses} value={selectedCourseCode} onChange={setSelectedCourseCode} />
                    </div>

                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        <div className="border-b border-slate-100 pb-3">
                            <h3 className="font-extrabold text-slate-900 text-sm flex items-center gap-2">
                                <i data-lucide="calendar" className="w-4 h-4 text-blue-700"></i>
                                <span>مواعيد امتحانات الفرق الدراسية ومراحل الكنترول خلال السنة الأكاديمية:</span>
                            </h3>
                            <p className="text-xs text-slate-500 mt-0.5">متابعة الفرق التي تقدمت للامتحانات وحالة قفل الكنترول لكل دفعة.</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {examSchedule.map((item) => (
                                <div key={item.level} className="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col justify-between space-y-3">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <span className="w-8 h-8 rounded-lg bg-blue-700 text-white font-extrabold flex items-center justify-center text-xs">L{item.level}</span>
                                            <div>
                                                <h4 className="font-bold text-slate-900 text-xs">{item.levelName} ({item.cohortCode})</h4>
                                                <span className="text-[10px] text-slate-500">{item.totalStudents} طالب مسجل</span>
                                            </div>
                                        </div>
                                        <span className={`px-2.5 py-1 rounded-full text-[10px] font-extrabold ${item.isLocked ? 'bg-emerald-100 text-emerald-800' : item.examStatus === 'قيد الرصد والاعتماد' ? 'bg-amber-100 text-amber-800' : 'bg-slate-200 text-slate-600'}`}>{item.examStatus}</span>
                                    </div>
                                    <div className="text-[11px] bg-white p-2.5 rounded-lg border border-slate-200 text-slate-700"><strong>مواعيد الامتحانات بالسنة:</strong> {item.season}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <div className="text-xs font-extrabold text-slate-700 mb-3">مراحل الكنترول للمقرر {selectedCourseCode}</div>
                        <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
                            {checklist.map((c, i) => (
                                <div key={c.label} className={`text-center text-[11px] font-bold py-2.5 px-2 rounded-xl border ${c.ok ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                    {c.ok ? '✔' : `${i + 1}.`} {c.label}
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-5">
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1"><span className="text-slate-400 text-xs font-bold block">إجمالي الطلاب المتقدمين:</span><span className="text-2xl font-black text-slate-900">{analytics.total} طالب</span></div>
                        <div className="bg-emerald-50 border border-emerald-200 p-5 rounded-2xl space-y-1"><span className="text-emerald-800 text-xs font-bold block">عدد الناجحين:</span><span className="text-2xl font-black text-emerald-950">{analytics.passCount} طالب</span></div>
                        <div className="bg-rose-50 border border-rose-200 p-5 rounded-2xl space-y-1"><span className="text-rose-800 text-xs font-bold block">عدد الراسبين:</span><span className="text-2xl font-black text-rose-950">{analytics.failCount} طالب</span></div>
                        <div className="bg-blue-50 border border-blue-200 p-5 rounded-2xl space-y-1"><span className="text-blue-800 text-xs font-bold block">نسبة النجاح العامة:</span><span className="text-2xl font-black text-blue-950">{allProcessed ? `${analytics.passRate}%` : '—'}</span></div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-center justify-between gap-6">
                        <div className="space-y-1">
                            <div className="flex items-center gap-2 flex-wrap">
                                <h3 className="font-extrabold text-slate-900 text-base">اعتماد وقفل الكنترول النهائي (Level 1 Approval)</h3>
                                {isApproved
                                    ? <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-0.5 rounded-full">معتمد ومقفل</span>
                                    : <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-0.5 rounded-full">بانتظار توقيع رئيس الكنترول</span>}
                            </div>
                            <p className="text-xs text-slate-500">توقيع اعتماد النتيجة يمنع أي تعديلات إضافية على شيتات المادة ويسمح بالنشر المباشر وتحديث المعدل التراكمي.</p>
                        </div>
                        <div className="flex items-center gap-3 flex-wrap">
                            <button onClick={handleApproveAndLockControl} disabled={isApproved} className={`px-5 py-3 rounded-xl font-extrabold text-xs shadow transition flex items-center gap-2 ${isApproved ? 'bg-slate-200 text-slate-500 cursor-not-allowed' : 'bg-purple-800 hover:bg-purple-900 text-white'}`}>
                                <i data-lucide="shield-check" className="w-4 h-4"></i><span>توقيع وتعميد الكنترول النهائي (Lock Control)</span>
                            </button>
                            <button onClick={handlePublishResults} disabled={isPublished} className={`px-5 py-3 rounded-xl font-extrabold text-xs shadow transition flex items-center gap-2 ${isPublished ? 'bg-emerald-200 text-emerald-800 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 text-white'}`}>
                                <i data-lucide="send" className="w-4 h-4"></i><span>{isPublished ? 'النتيجة منشورة بالفعل 🟢' : 'نشر النتيجة فوراً للطلاب (Publish Grades)'}</span>
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm p-5 space-y-3">
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <h3 className="font-extrabold text-slate-900 text-sm">معاينة حساب المعدل التراكمي (CGPA)</h3>
                            <span className="text-[11px] text-slate-500 font-semibold">المقرر: {credits} ساعات معتمدة · الحساب موزون بالساعات المجتازة سابقاً (تقدير تقريبي)</span>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-xs">
                                <thead className="bg-slate-100 text-slate-700 font-extrabold border-b border-slate-200">
                                    <tr>
                                        <th className="p-3">الطالب</th>
                                        <th className="p-3 text-center">المجموع</th>
                                        <th className="p-3 text-center">التقدير</th>
                                        <th className="p-3 text-center">النقاط</th>
                                        <th className="p-3 text-center">{isPublished ? 'CGPA بعد النشر' : 'CGPA الحالي'}</th>
                                        <th className="p-3 text-center">{isPublished ? 'الساعات المجتازة' : 'CGPA المتوقع بعد النشر'}</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-200">
                                    {cgpaPreview.map(({ g, st, projected }) => (
                                        <tr key={g.id} className="hover:bg-slate-50">
                                            <td className="p-3 font-bold text-slate-900"><span className="font-mono text-blue-700 block text-[11px]">{g.academicId}</span>{g.studentName}</td>
                                            <td className="p-3 text-center font-mono font-bold">{g.processed ? g.totalMark : '—'}</td>
                                            <td className="p-3 text-center font-mono font-black">{g.processed ? g.letterGrade : '—'}</td>
                                            <td className="p-3 text-center font-mono">{g.processed ? Number(g.points).toFixed(1) : '—'}</td>
                                            <td className="p-3 text-center font-mono font-bold text-slate-700">{st ? st.cgpa : '—'}</td>
                                            <td className="p-3 text-center font-mono font-extrabold text-blue-800">{isPublished ? (st ? st.passedCredits : '—') : (projected !== null ? projected : '—')}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);

        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 300);
    </script>
</body>
</html>
